<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ball Preview — Billar Pro</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#0b120b;color:#e8efe8;padding:24px}
    h1{color:#f0c040}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px}
    .card{background:linear-gradient(180deg,#111815,#0c120c);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.04);text-align:center}
    img{width:96px;height:96px;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.6);}
    .lbl{margin-top:10px;font-weight:700}
  </style>
</head>
<body>
  <h1>Ball Preview</h1>
  <p>SVG images generated for balls 1–15. If you want different styling, tell me which ball(s) to change.</p>
  <div class="grid">
    <div class="card"><img src="./balls/ball-1.svg" alt="1"><div class="lbl">Ball 1</div></div>
    <div class="card"><img src="./balls/ball-2.svg" alt="2"><div class="lbl">Ball 2</div></div>
    <div class="card"><img src="./balls/ball-3.svg" alt="3"><div class="lbl">Ball 3</div></div>
    <div class="card"><img src="./balls/ball-4.svg" alt="4"><div class="lbl">Ball 4</div></div>
    <div class="card"><img src="./balls/ball-5.svg" alt="5"><div class="lbl">Ball 5</div></div>
    <div class="card"><img src="./balls/ball-6.svg" alt="6"><div class="lbl">Ball 6</div></div>
    <div class="card"><img src="./balls/ball-7.svg" alt="7"><div class="lbl">Ball 7</div></div>
    <div class="card"><img src="./balls/ball-8.svg" alt="8"><div class="lbl">Ball 8</div></div>
    <div class="card"><img src="./balls/ball-9.svg" alt="9"><div class="lbl">Ball 9</div></div>
    <div class="card"><img src="./balls/ball-10.svg" alt="10"><div class="lbl">Ball 10</div></div>
    <div class="card"><img src="./balls/ball-11.svg" alt="11"><div class="lbl">Ball 11</div></div>
    <div class="card"><img src="./balls/ball-12.svg" alt="12"><div class="lbl">Ball 12</div></div>
    <div class="card"><img src="./balls/ball-13.svg" alt="13"><div class="lbl">Ball 13</div></div>
    <div class="card"><img src="./balls/ball-14.svg" alt="14"><div class="lbl">Ball 14</div></div>
    <div class="card"><img src="./balls/ball-15.svg" alt="15"><div class="lbl">Ball 15</div></div>
  </div>
</body>
</html>
