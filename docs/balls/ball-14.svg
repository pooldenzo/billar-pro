<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/></filter>
    <radialGradient id="ballFill" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f3f3f3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dadada" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow" cx="32%" cy="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="100" cy="100" r="84"/></clipPath>
  </defs>
  <g filter="url(#sh)">
    <circle cx="100" cy="100" r="84" fill="url(#ballFill)" />
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="200" height="56" fill="#ffffff" />
      <rect x="0" y="72" width="200" height="56" fill="#2e7d32" />
      <rect x="0" y="144" width="200" height="56" fill="#ffffff" />
    </g>
    <circle cx="72" cy="66" r="18" fill="url(#glow)" />
  </g>
  <g>
    <circle cx="100" cy="100" r="36" fill="#ffffff" stroke="#ccc" stroke-width="2" />
    <text x="100" y="110" font-family="Verdana" font-weight="700" font-size="46" text-anchor="middle" fill="#111">14</text>
  </g>
</svg>